{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
    ثبت نام
{% endblock %}

{% block content %}
    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-center mt-5" dir="rtl">
            <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-11 bg-white border rounded px-4 pt-4 pb-4 shadow">

                <h2 class="text-center mb-4 fw-bold">ثبت‌نام</h2>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}

                    <button type="submit" class="btn btn-success mt-3 w-100 fw-bold">
                        ثبت‌نام
                    </button>

                    <div class="line-with-middle-sep my-3 text-center text-muted">
                        <span>یا</span>
                    </div>

                    <a href="{% url 'login' %}" class="btn btn-outline-primary w-100 fw-bold">
                        ورود به حساب کاربری
                    </a>
                </form>

            </div>
        </div>
    </div>
{% endblock %}
