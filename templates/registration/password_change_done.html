{% extends "_base.html" %}

{% block page_title %}
    رمز عبور با موفقیت تغییر یافت
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-center mt-5" dir="rtl">
        <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-11 bg-white border rounded px-4 pt-4 pb-4 shadow text-center">

            <div class="mb-3 text-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-check-circle" viewBox="0 0 16 16">
                    <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                    <path d="M10.97 4.97a.235.235 0 0 0-.02.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-1.071-1.05z"/>
                </svg>
            </div>

            <h3 class="fw-bold mb-3">تغییر رمز موفقیت‌آمیز بود</h3>
            <p class="text-muted small leading-relaxed mb-4">
                رمز عبور حساب کاربری شما با موفقیت به‌روزرسانی شد و حساب شما در امنیت کامل است.
            </p>

            <a href="{% url 'login' %}" class="btn btn-primary w-100 fw-bold">
                بازگشت به حساب / ورود
            </a>

        </div>
    </div>
</div>
{% endblock %}
