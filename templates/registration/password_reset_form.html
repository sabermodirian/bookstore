{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
    فراموشی رمز عبور
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-center mt-5" dir="rtl">
        <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-11 bg-white border rounded px-4 pt-4 pb-4 shadow">

            <h3 class="text-center mb-3 fw-bold">بازیابی رمز عبور</h3>
            <p class="text-muted small text-center mb-4">ایمیل حساب کاربری خود را وارد کنید تا لینک بازنشانی برایتان ارسال شود.</p>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" class="btn btn-success mt-3 w-100 fw-bold">
                    ارسال لینک بازیابی
                </button>

                <div class="text-center mt-3">
                    <a class="text-decoration-none small" href="{% url 'login' %}">
                        بازگشت به صفحه ورود
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
