{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
    Sending Email
{% endblock %}

{% block content %}

<div class="container mt-4 mb-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <h1 class="mb-4">Send Email</h1>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" class="btn btn-success">
                    Send
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
