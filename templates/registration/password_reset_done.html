{% extends "_base.html" %}

{% block page_title %}
    ایمیل بازیابی ارسال شد
{% endblock %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="d-flex justify-content-center mt-5" dir="rtl">
        <div class="col-xl-4 col-lg-5 col-md-6 col-sm-8 col-11 bg-white border rounded px-4 pt-4 pb-4 shadow text-center">

            <div class="mb-3 text-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="currentColor" class="bi bi-envelope-check" viewBox="0 0 16 16">
                    <path d="M2 2a2 2 0 0 0-2 2v8.01A2 2 0 0 0 2 14h5.5a.5.5 0 0 0 0-1H2a1 1 0 0 1-.966-.741l5.64-3.471L8 9.583l7-4.2V8.5a.5.5 0 0 0 1 0V4a2 2 0 0 0-2-2H2Zm3.708 6.208L1 11.105V5.383l4.708 2.825ZM1 4.217V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v.217l-7 4.2-7-4.2Z"/>
                    <path d="M16 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0Zm-1.993-1.679a.5.5 0 0 0-.686.172l-1.17 1.95-.547-.547a.5.5 0 0 0-.708.708l1 1a.5.5 0 0 0 .752-.044l1.5-2.5a.5.5 0 0 0-.141-.739Z"/>
                </svg>
            </div>

            <h3 class="fw-bold mb-3">ایمیل ارسال شد!</h3>
            <p class="text-muted small leading-relaxed mb-4">
                دستورالعمل تنظیم رمز عبور جدید به ایمیل شما ارسال شد. لطفاً صندوق ورودی (و پوشه Spam) خود را بررسی کنید.
            </p>

            <a href="{% url 'login' %}" class="btn btn-primary w-100 fw-bold">
                بازگشت به صفحه ورود
            </a>

        </div>
    </div>
</div>
{% endblock %}
