{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
    Login Bookstore
{% endblock %}

{% block content %}
    <div class="container mt-4 mb-5">
        <div class="d-flex justify-content-center mt-5" dir="rtl">

            <div class="col-xl-3 col-lg-4 col-md-5 col-sm-6 col-11
                        bg-white border rounded px-4 pt-4 pb-3 shadow">

                <form method="post">
                    {% csrf_token %}

                    {{ form|crispy }}

                    <button type="submit" class="btn btn-success mt-3 w-100">
                        ورود
                    </button>

                    <div class="line-with-middle-sep">
                        <span>یا</span>
                    </div>

                    <a href="{% url 'signup' %}"
                       class="btn btn-primary mt-2 mb-3 w-100">
                        ثبت‌نام
                    </a>

                    <div class="text-center">
                        <a class="text-decoration-none"
                           href="{% url 'password_reset' %}">
                            فراموشی رمز عبور
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
{% endblock %}
