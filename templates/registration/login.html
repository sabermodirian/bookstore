{% extends "_base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}
    Login Bookstore
{% endblock %}

{% block content %}

<div class="container mt-4 mb-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <h1 class="mb-4">Login</h1>

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <button type="submit" class="btn btn-success">
                    Log In
                </button>
            </form>
            <p><a href="{% url 'password_reset' %}">Forgot Password ? </a> |
                <a href="{% url 'signup' %}">If you want create an new account? Please Sign Up</a> </p>
        </div>
    </div>
</div>
{% endblock %}
