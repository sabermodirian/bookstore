{% load static %}

<html lang=" ">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,  initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block page_title %}

    {% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">


</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-info" dir="rtl">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="{% static 'icons/book.png' %}" alt="" height="30"
                 class="d-inline-block align-text-top">
        </a>
        <a class="navbar-brand mx-3" href="#">کتاب یار</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
                aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
                <a class="nav-link active" aria-current="page" href="{% url 'books:book_list' %}">خانه</a>
                <a class="nav-link" href="{% url 'books:book_create' %}">اضافه کردن کتاب</a>
            </div>
        </div>
        <div class="mx-2 text-white">
            {% if user.is_authenticated %}

                <form method="post" action="{% url 'logout' %}" class="d-inline">
                    {% csrf_token %}
                 <span>  {{ user.username }} خوش آمدی | </span>
                    <button type="submit" class="btn btn-link p-0"> خروج</button>
                </form>
            {% else %}
                <a class="Link-light text-decoration-none" href="{% url 'login' %}">ورود</a>
                <span>یا</span>
                <a class="Link-light text-decoration-none" href="{% url 'signup' %}">ثبت نام</a>
            {% endif %}


        </div>
    </div>
</nav>
{% block content %}

{% endblock %}

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
